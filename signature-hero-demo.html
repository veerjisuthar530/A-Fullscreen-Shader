<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signature Hero — Aurora Shader</title>
<style>
  :root{
    --ink: #0a0e1a;
    --paper: #f5f1e8;
    --slate: #9aa3b5;
    --lime: #c8ff4d;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    height: 100%;
    background: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .hero{
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 560px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }

  /* Canvas sits behind everything, fullscreen */
  #shader-canvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* CSS fallback if WebGL isn't available at all */
  .hero.no-webgl{
    background: radial-gradient(120% 100% at 20% 0%, #1b3a6b 0%, #0a0e1a 55%),
                linear-gradient(160deg, #0a0e1a 0%, #12203a 60%, #0a0e1a 100%);
  }

  .hero-content{
    position: relative;
    z-index: 2;
    padding: clamp(24px, 6vw, 72px);
    max-width: 760px;
  }

  .eyebrow{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--lime);
    margin: 0 0 14px 0;
    opacity: 0.9;
  }

  h1{
    margin: 0 0 16px 0;
    color: var(--paper);
    font-size: clamp(32px, 5.5vw, 58px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 24px rgba(0,0,0,0.45);
  }

  h1 span{
    color: var(--lime);
  }

  p.sub{
    margin: 0 0 28px 0;
    color: var(--slate);
    font-size: clamp(15px, 1.6vw, 18px);
    line-height: 1.5;
    max-width: 46ch;
    text-shadow: 0 1px 12px rgba(0,0,0,0.5);
  }

  .cta{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 999px;
    text-decoration: none;
  }

  .fallback-note{
    position: absolute;
    bottom: 14px;
    right: 18px;
    z-index: 2;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: var(--slate);
    opacity: 0.6;
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="shader-canvas"></canvas>

  <div class="hero-content">
    <p class="eyebrow">// learning in public — signal_04</p>
    <h1>Building fluency, <span>one shipped thing</span> at a time.</h1>
    <p class="sub">
      A running log of turning "AI is scary" into working software —
      prompts, agents, and the occasional shader, documented as I go.
    </p>
    <a class="cta" href="#work">See the build log →</a>
  </div>

  <div class="fallback-note" id="mode-note"></div>
</section>

<script>
/* =========================================================
   SIGNATURE HERO SHADER — harness (plain WebGL1, no libs)
   =========================================================
   What this file does, top to bottom:
   1. Detect prefers-reduced-motion and WebGL support up front.
   2. Compile a tiny vertex shader (just draws a fullscreen
      triangle) + the fragment shader (the actual visual).
   3. Feed it three uniforms: u_resolution, u_time, u_mouse.
   4. Animate with requestAnimationFrame, but:
        - cap devicePixelRatio at 2 (perf)
        - pause the loop when the tab is hidden (perf)
        - skip the loop entirely for reduced-motion users and
          draw ONE static frame instead (accessibility)
   ========================================================= */

(function () {
  const canvas = document.getElementById('shader-canvas');
  const heroEl = document.getElementById('hero');
  const modeNote = document.getElementById('mode-note');
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false });

  // ---- No WebGL at all? Bail to the CSS gradient in the stylesheet. ----
  if (!gl) {
    heroEl.classList.add('no-webgl');
    canvas.style.display = 'none';
    modeNote.textContent = 'fallback: css gradient (no webgl)';
    return;
  }

  const prefersReducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  // ---------------------------------------------------------
  // Shaders
  // ---------------------------------------------------------
  const vertexSrc = `
    attribute vec2 a_position;
    void main() {
      // A single big triangle that covers the whole screen is
      // cheaper than two triangles for a quad — the corners
      // just get clipped, which is fine since we only care
      // about the pixels inside the viewport.
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentSrc = `
    precision highp float;

    uniform vec2 u_resolution;
    uniform float u_time;
    uniform vec2 u_mouse;
    uniform float u_staticFrame; // 1.0 for reduced-motion: freeze time

    // ---- Hash: turns a 2D point into a pseudo-random 0..1 value ----
    // This is the randomness "engine" everything else below is built on.
    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    // ---- Value noise: smooth random blobs, not TV static ----
    // Sample hash() at the 4 corners of a grid cell and blend between
    // them so neighboring points get similar values instead of pure noise.
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      vec2 u = f * f * (3.0 - 2.0 * f); // ease the blend (smoothstep curve)
      return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }

    // ---- FBM (fractal brownian motion): noise made of noise ----
    // Stack several octaves of the noise above at shrinking scale and
    // weight. This is what turns one blobby shape into the layered,
    // cloud-like texture an aurora needs.
    float fbm(vec2 p) {
      float value = 0.0;
      float amplitude = 0.5;
      for (int i = 0; i < 5; i++) {
        value += amplitude * noise(p);
        p *= 2.0;
        amplitude *= 0.5;
      }
      return value;
    }

    void main() {
      // ---- 1. Coordinates ----
      // gl_FragCoord is in pixels. Dividing by resolution gives "uv"
      // in 0..1. We stretch x by the aspect ratio so the noise field
      // reads as the same shape on a phone as on a wide monitor.
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      vec2 p = uv;
      p.x *= u_resolution.x / u_resolution.y;

      vec2 mouseUv = u_mouse;
      mouseUv.x *= u_resolution.x / u_resolution.y;

      // ---- 2. Mouse influence ----
      // Direction from this pixel toward the cursor, applied only near
      // the cursor (smoothstep falloff) — so the field leans toward
      // attention instead of the whole image dragging with the mouse.
      float distToMouse = length(p - mouseUv);
      vec2 pull = normalize(mouseUv - p + 0.0001)
                  * smoothstep(0.55, 0.0, distToMouse) * 0.18;
      vec2 q = p + pull;

      // ---- 3. Time ----
      // u_staticFrame freezes time at a fixed, pleasant value for
      // reduced-motion users: one still composition, not a paused
      // mid-motion frame that looks broken.
      float t = mix(u_time, 6.0, u_staticFrame) * 0.06;

      // ---- 4. Domain-warped flow field ----
      // Classic "warp noise with noise" trick: run fbm once to get a
      // flow direction, then feed THAT into a second fbm call. Plain
      // fbm alone looks like clouds; feeding it into itself is what
      // gives the ribbon/curl look an aurora actually has.
      float n1 = fbm(q * 2.2 + vec2(t, t * 0.7));
      float n2 = fbm(q * 2.2 - vec2(t * 0.8, t * 0.4) + 4.7);
      float flow = fbm(q * 1.6 + vec2(n1, n2) * 1.4 + t * 0.3);

      // ---- 5. Palette ----
      // Four hand-picked colors, mixed by the flow/noise values above.
      // This is the part I changed to make it mine: ink + cobalt +
      // lime "spark" + warm gold — a notebook-and-highlighter feel
      // instead of the default teal/purple aurora.
      vec3 ink    = vec3(0.039, 0.055, 0.102);
      vec3 cobalt = vec3(0.086, 0.227, 0.420);
      vec3 lime   = vec3(0.784, 1.000, 0.302);
      vec3 gold   = vec3(0.941, 0.706, 0.161);

      vec3 col = mix(ink, cobalt, smoothstep(0.15, 0.65, flow));
      col = mix(col, lime, smoothstep(0.55, 0.9, n2) * 0.6);
      col += gold * smoothstep(0.88, 1.0, n1) * 0.5;

      // ---- 6. Contrast band ----
      // Darken the upper part of the frame so headline text sitting
      // there stays readable without a heavy solid overlay on top.
      float topDarken = smoothstep(0.0, 0.7, uv.y);
      col *= mix(0.5, 1.0, topDarken);

      // ---- 7. Grain ----
      // A little per-pixel noise, reseeded by time, breaks up color
      // banding and gives the gradient a bit of texture instead of
      // looking like a flat CSS gradient.
      float grain = hash(uv * u_resolution.xy + u_time * 41.0) - 0.5;
      col += grain * 0.03;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(shader));
    }
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSrc));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSrc));
  gl.linkProgram(program);
  gl.useProgram(program);

  // Fullscreen triangle: 3 points, big enough to cover the clip space.
  const positionBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 3, -1, -1, 3]),
    gl.STATIC_DRAW
  );
  const posLoc = gl.getAttribLocation(program, 'a_position');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  const u_resolution = gl.getUniformLocation(program, 'u_resolution');
  const u_time = gl.getUniformLocation(program, 'u_time');
  const u_mouse = gl.getUniformLocation(program, 'u_mouse');
  const u_staticFrame = gl.getUniformLocation(program, 'u_staticFrame');

  // ---- DPR cap: sharp on retina screens without melting a phone GPU ----
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  let mouseTarget = { x: 0.5, y: 0.5 };
  let mouseSmooth = { x: 0.5, y: 0.5 };

  function resize() {
    const w = Math.floor(canvas.clientWidth * DPR);
    const h = Math.floor(canvas.clientHeight * DPR);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  function onPointerMove(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = 1.0 - (e.clientY - rect.top) / rect.height; // flip for GL's y-up
    mouseTarget.x = x;
    mouseTarget.y = y;
  }

  function draw(timeSeconds) {
    resize();
    // Ease the mouse toward its target so the field drifts gently
    // instead of snapping — feels closer to a current than a cursor.
    mouseSmooth.x += (mouseTarget.x - mouseSmooth.x) * 0.06;
    mouseSmooth.y += (mouseTarget.y - mouseSmooth.y) * 0.06;

    gl.uniform2f(u_resolution, canvas.width, canvas.height);
    gl.uniform1f(u_time, timeSeconds);
    gl.uniform2f(u_mouse, mouseSmooth.x, mouseSmooth.y);
    gl.uniform1f(u_staticFrame, prefersReducedMotion ? 1.0 : 0.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  let rafId = null;
  function loop(tMs) {
    draw(tMs / 1000);
    rafId = requestAnimationFrame(loop);
  }

  function start() {
    if (rafId === null) rafId = requestAnimationFrame(loop);
  }
  function stop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  window.addEventListener('resize', resize);

  if (prefersReducedMotion) {
    // ---- Accessibility fallback: one static, still frame ----
    modeNote.textContent = 'mode: static frame (prefers-reduced-motion)';
    resize();
    draw(0);
    // No mousemove listener, no rAF loop — nothing animates.
  } else {
    modeNote.textContent = 'mode: animated (move your cursor)';
    canvas.addEventListener('pointermove', onPointerMove);
    // ---- Perf: pause the render loop when the tab isn't visible ----
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop();
      else start();
    });
    start();
  }
})();
</script>

</body>
</html>
